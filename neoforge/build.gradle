plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// ─── LavaPlayer 隔離ロード wiring ────────────────────────────────────────
// dev (runClient/runServer) では mod jar が無いので、packed jar の展開元を
// -Dmusicdiscmaker.dev で build dir から直接読ませる (これが無いと DependencyManager が
//  jar 経路に落ちて URL 解決が FAILED になる)。Fabric 側と同じ仕組み。
evaluationDependsOn(':lavaplayer')
def lavaImplNeo = project(':lavaplayer')
def lavaDevPath = lavaImplNeo.layout.buildDirectory.dir('libs').get().asFile.absolutePath +
        ';' + lavaImplNeo.layout.buildDirectory.dir('dependencies').get().asFile.absolutePath

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // Parchment is not used for 26.1+ — Mojang ships official parameter names.
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            // dev: 隔離 classloader が読む packed jar の展開元 (mod jar 未経由)
            systemProperty('musicdiscmaker.dev', lavaDevPath)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // headless の起動ゲート (:neoforge:runGameTestServer)。GameTest は未実装なので登録テストは 0 件、
        // mixin 適用とサーバー起動完了を exit code で判定する用途。
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ─── LavaPlayer 一式を mod jar に同梱 (隔離 classloader が runtime ロード) ───
// MDG の最終成果物は 'jar' task (remap 無し)。dependencies/*.jar.packed に同梱する。
tasks.named('jar').configure {
    dependsOn lavaImplNeo.tasks.named('assemble')
    into('dependencies') {
        from(lavaImplNeo.layout.buildDirectory.dir('libs')) { include '*.jar.packed' }
        from(lavaImplNeo.layout.buildDirectory.dir('dependencies')) { include '*.jar.packed' }
    }
}

// dev run も隔離ロード用の packed jar が要るので assemble に依存させる
tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn lavaImplNeo.tasks.named('assemble')
}

// ─── 互換 mod (ソフト依存・compileOnly = 公開 jar には含めない) ───────────────
// AA=両ローダー対象、SC/SB=NeoForge 専用。実行時にロードされている時だけ動く。
// compat jar は 1.21.11 実 jar (compileOnly なので実バイトコードは実 mod がロードされた時に解決される)。
dependencies {
    compileOnly files('compat-libs/sophisticatedcore-1.21.11-1.4.86.2197.jar')
    compileOnly files('compat-libs/additionaladditions-neoforge-10.0.9.jar')
}
