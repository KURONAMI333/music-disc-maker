plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// ─── LavaPlayer 隔離ロード wiring ────────────────────────────────────────
// dev (runClient/runServer) では mod jar が無いので、packed jar の展開元を
// -Dmusicdiscmaker.dev で build dir から直接読ませる (これが無いと DependencyManager が
//  jar 経路に落ちて URL 解決が FAILED になる)。Fabric 側と同じ仕組み。
evaluationDependsOn(':lavaplayer')
def lavaImplNeo = project(':lavaplayer')
def lavaDevPath = lavaImplNeo.layout.buildDirectory.dir('libs').get().asFile.absolutePath +
        ';' + lavaImplNeo.layout.buildDirectory.dir('dependencies').get().asFile.absolutePath

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            // dev: 隔離 classloader が読む packed jar の展開元 (mod jar 未経由)
            systemProperty('musicdiscmaker.dev', lavaDevPath)
            // 一時的な診断: mixin の適用結果を run/.mixin.out/class/... へ書き出す。
            // 「@Inject が当たったか」をログに依存せず yes/no のファイルとして確認できる。
            // (蓄音機経路の切り分けが済んだら消す)
            systemProperty('mixin.debug.export', 'true')
            systemProperty('mixin.debug.verbose', 'true')
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // headless の挙動テスト。全 PASS で exit code 0 / 1 本でも失敗で非 0 (成否の一次判定)。
        // enabledGameTestNamespaces は configureEach で全 run に入っている。
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ─── LavaPlayer 一式を mod jar に同梱 (隔離 classloader が runtime ロード) ───
// MDG の最終成果物は 'jar' task (remap 無し)。dependencies/*.jar.packed に同梱する。
tasks.named('jar').configure {
    dependsOn lavaImplNeo.tasks.named('assemble')
    into('dependencies') {
        from(lavaImplNeo.layout.buildDirectory.dir('libs')) { include '*.jar.packed' }
        from(lavaImplNeo.layout.buildDirectory.dir('dependencies')) { include '*.jar.packed' }
    }
}

// dev run も隔離ロード用の packed jar が要るので assemble に依存させる
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn lavaImplNeo.tasks.named('assemble')
}

dependencies {
    // Sophisticated Core (互換): custom disc を SB の Jukebox Upgrade で使えるよう IDiscHandler を登録する。
    // compileOnly のみ = ソフト依存。compat コードは runtime に sophisticatedcore がロードされている時だけ動く。
    compileOnly files('compat-libs/sophisticatedcore-1.21.1-1.4.42.1892.jar')

    // Additional Additions (互換): アルバムに入れた custom disc の実音声をストリーム再生する。
    // compileOnly のみ = ソフト依存 (mods.toml に依存宣言しない)。compat コードは runtime に
    // additionaladditions がロードされている時だけ動く。dev で実挙動を試すなら runtimeOnly に足す。
    compileOnly files('compat-libs/additionaladditions-neoforge-10.0.5.jar')

    // Create (互換): 捕獲式 contraption に載った強化版ジュークボックスの再生継続 (MovementBehaviour)。
    // compileOnly のみ = ソフト依存。compat/create のコードは runtime に create がロードされている時だけ動く。
    // MovementBehaviour interface の signature が Registrate/Flywheel の型を参照するため compile 分だけ添える。
    compileOnly files('compat-libs/create-1.21.1-6.0.10.jar')

    // Sable (互換): Create Aeronautics の物理飛空艇 = Sable 変換式 sub-level に載った強化版ジュークボックスの
    // 位置追従。Aeronautics 本体 (aeronautics/simulated) ではなく、その必須依存の物理エンジン Sable を参照する
    // (sub-level 座標変換 API = Sable.HELPER.getContainingClient / ClientSubLevel.renderPose().transformPosition,
    // ServerSubLevelContainer.getPlayersTracking を提供する層)。compileOnly のみ = ソフト依存。compat/aeronautics
    // のコードは runtime に sable がロードされている時だけ動く。companion=API 型 (Pose3d/SubLevelAccess)、
    // veil=Sable の上位型解決 (playerSink 等) の compile 分。
    compileOnly files('compat-libs/sable-neoforge-1.21.1-2.0.3.jar')
    compileOnly files('compat-libs/sable-companion-common-1.21.1-1.6.0.jar')
    compileOnly files('compat-libs/veil-neoforge-1.21.1-4.1.4.jar')

    // Traveler's Backpack (互換): 26.2 で Sophisticated Backpacks が未対応な帯の受け皿。
    // Jukebox Upgrade スロットに custom disc を入れて LavaPlayer 再生する。
    // compileOnly のみ = ソフト依存。compat/travelersbackpack のコードは runtime に
    // travelersbackpack がロードされている時だけ動く (mixin は @Pseudo で無害化)。
    compileOnly files('compat-libs/travelersbackpack-neoforge-1.21.1-10.1.38.jar')

    // [Let's Do] Furniture (互換): Gramophone (蓄音機) に挿した custom disc を実音声でストリーム再生する。
    // compileOnly のみ = ソフト依存 (mods.toml に依存宣言しない)。compat コードは runtime に
    // furniture がロードされている時だけ動く (mixin は @Pseudo で無害化)。
    compileOnly files('compat-libs/letsdo-furniture-neoforge-1.1.4.jar')
}
