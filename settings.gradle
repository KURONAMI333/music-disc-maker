pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MultiLoader-Template'
include("common")
include("fabric")
include("forge")

// LavaPlayer は隔離 URLClassLoader で runtime ロードする (mod-046 と同じ正攻法)。
//  - lavaplayer-api : mod <-> LavaPlayer の橋渡し interface (common 経由で各ローダーの mod classloader に載る)
//  - lavaplayer     : LavaPlayer を使う impl + 依存を .jar.packed で同梱 (隔離 classloader が読む)
include('lavaplayer-api')
include('lavaplayer')
