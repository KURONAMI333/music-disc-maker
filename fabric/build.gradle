plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    // MC 1.21.11 は難読化ありなので mappings 宣言 + remap 経路 (modImplementation) が要る。
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // ─── 互換 mod (ソフト依存・非同梱) ───────────────────────────────────
    // AA=両ローダー対象。SC/SB は 1.21.11 Fabric port が存在しないため Fabric では no-op。
    // AA は両ローダーで同一 package (one.dqu.additionaladditions.*) を使う。loom が intermediary →
    // mojmap に remap するので modCompileOnly で載せる。
    modCompileOnly files('compat-libs/additionaladditions-fabric-10.0.9.jar')
}

// ─── LavaPlayer 隔離ロード wiring ────────────────────────────────────────
// LavaPlayer は隔離 URLClassLoader で runtime ロードする。dev (runClient/runServer) では
// mod jar が無いので、packed jar の展開元を -Dmusicdiscmaker.dev で build dir から直接読ませる。
// (NeoForge 側の build.gradle と同じ仕組み。これが無いと DependencyManager が jar 経路に落ちて
//  「mod jar 内の dependencies を特定できない」で URL 解決が失敗する。)
evaluationDependsOn(':lavaplayer')
def lavaImplFab = project(':lavaplayer')
def lavaDevPath = lavaImplFab.layout.buildDirectory.dir('libs').get().asFile.absolutePath +
        ';' + lavaImplFab.layout.buildDirectory.dir('dependencies').get().asFile.absolutePath

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // loom.mixin ブロックは置かない: Loom 1.14.10 は mixin アノテーションを remapJar 時に静的 remap
    // する (Fabric-Loom-Mixin-Remap-Type: static)。refmap を宣言すると存在しない refmap を指す jar になる。
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            property('musicdiscmaker.dev', lavaDevPath)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            property('musicdiscmaker.dev', lavaDevPath)
        }
    }
}

// ─── LavaPlayer 一式を mod jar に同梱 (隔離 classloader が runtime ロード) ───
// Loom の最終成果物は remapJar (jar を消費)。jar に dependencies/*.jar.packed を入れる。
tasks.named('jar').configure {
    dependsOn lavaImplFab.tasks.named('assemble')
    into('dependencies') {
        from(lavaImplFab.layout.buildDirectory.dir('libs')) { include '*.jar.packed' }
        from(lavaImplFab.layout.buildDirectory.dir('dependencies')) { include '*.jar.packed' }
    }
}

// dev run も隔離ロード用の packed jar が要るので assemble に依存させる
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn lavaImplFab.tasks.named('assemble')
}
