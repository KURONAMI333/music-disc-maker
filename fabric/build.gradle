plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    // MC 26.x は難読化解除済み (Mojang 公式名が jar に同梱)。intermediary/proguard mappings は
    // 廃止されたため mappings 宣言は不要 (fabric-example-mod HEAD と同じ)。mod 依存も remap 不要なので
    // modImplementation ではなく implementation で載せる。
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // ─── 互換 mod (ソフト依存・compileOnly = 公開 jar には含めない) ─────────────
    // AA=両ローダー対象。SC/SB は 26.2 Fabric port が存在しないため Fabric では no-op (GAP_LOG P3 §compat)。
    // AA は両ローダーで同一 package (one.dqu.additionaladditions.*) を使い、compat コードが参照する
    // album API シグネチャは mojmap の vanilla/AA 型のみ。26.2 は難読化解除済みで loom も remap しないため、
    // mojmap 名前空間の AA jar が要る (1.21.1 の intermediary 版は不可)。26.2 fabric AA jar 未取得のため
    // mojmap の AA jar (10.0.9・namespace は loader 非依存) を compileOnly classpath として流用する。
    // runtime は実 fabric AA が同 package を供給 (compileOnly=非同梱)。26.2 fabric AA jar 取得後に差し替え可。
    compileOnly files('compat-libs/additionaladditions-10.0.9-mojmap.jar')
}

// ─── LavaPlayer 隔離ロード wiring ────────────────────────────────────────
// LavaPlayer は隔離 URLClassLoader で runtime ロードする。dev (runClient/runServer) では
// mod jar が無いので、packed jar の展開元を -Dmusicdiscmaker.dev で build dir から直接読ませる。
// (NeoForge 側の build.gradle と同じ仕組み。これが無いと DependencyManager が jar 経路に落ちて
//  「mod jar 内の dependencies を特定できない」で URL 解決が失敗する。)
evaluationDependsOn(':lavaplayer')
def lavaImplFab = project(':lavaplayer')
def lavaDevPath = lavaImplFab.layout.buildDirectory.dir('libs').get().asFile.absolutePath +
        ';' + lavaImplFab.layout.buildDirectory.dir('dependencies').get().asFile.absolutePath

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // MC 26.x は難読化解除済みで mappings/refmap 不要なので loom.mixin ブロックは置かない。
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            property('musicdiscmaker.dev', lavaDevPath)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            property('musicdiscmaker.dev', lavaDevPath)
        }
    }
}

// ─── LavaPlayer 一式を mod jar に同梱 (隔離 classloader が runtime ロード) ───
// Loom の最終成果物は remapJar (jar を消費)。jar に dependencies/*.jar.packed を入れる。
tasks.named('jar').configure {
    dependsOn lavaImplFab.tasks.named('assemble')
    into('dependencies') {
        from(lavaImplFab.layout.buildDirectory.dir('libs')) { include '*.jar.packed' }
        from(lavaImplFab.layout.buildDirectory.dir('dependencies')) { include '*.jar.packed' }
    }
}

// dev run も隔離ロード用の packed jar が要るので assemble に依存させる
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn lavaImplFab.tasks.named('assemble')
}
