plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // JUnit 層から MC のクラス (BlockPos / AudioStream 等) を引けるようにする。これが無いと
    // test の compile classpath に MC が載らず、PlaybackSessions も LavaPlayerAudioStream も
    // 参照した時点で compile error になる = 実物を回すテストが原理的に書けない。
    // 足すのは test source set だけで、production の compile/runtime には何も増えない。
    addModdingDependenciesTo sourceSets.test
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    // JUnit 層。lavaplayer サブプロジェクトと同じ版で揃える。MC を引くクラス
    // (PlaybackSessions / LavaPlayerAudioStream) も対象で、classpath は上の
    // addModdingDependenciesTo が通してある。Minecraft.getInstance() を掴む経路
    // (ClientPlaybackManager) だけは headless で回らないので、判断はそこから出しておくこと。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test').configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

