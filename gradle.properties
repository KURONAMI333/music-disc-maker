# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=2.1.0
group=com.kuronami.musicdiscmaker
java_version=25

# Common
# Minecraft 26.2 / NeoForge 26.2.x。Java 25 必須。Parchment は不要
# (26.1 以降 Mojang が難読化解除済みソースに公式パラメータ名を同梱)。
minecraft_version=26.2
mod_name=Music Disc Maker
mod_author=KURONAMI
mod_id=music_disc_maker
license=MIT
credits=
description=Craft playable music discs from any YouTube, Spotify, or SoundCloud link and play them in a vanilla jukebox.
minecraft_version_range=[26.2,)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric
fabric_version=0.155.2+26.2
fabric_loader_version=0.19.3

# Forge (未使用: settings.gradle に forge サブプロジェクトは無い。expandProps 用に据え置き)
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=26.2.0.28-beta
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# LavaPlayer 同梱の cross-project 配線 (build dir を config 時に解決) が
# configuration-cache と相性が悪いため無効化。確実に動く方を優先。
org.gradle.configuration-cache=false
